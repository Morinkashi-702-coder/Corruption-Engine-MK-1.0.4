; Game Data Configuration for FNF Psych Engine 1.0.4
; Configuración de datos del juego para FNF Psych Engine 1.0.4
; Customize your game settings here
; Personaliza aquí la configuración de tu juego

; ===== MENU (NULLDEMO) SETTINGS =====
; ===== AJUSTES DE MENÚ (NULLDEMO) =====
[menu]
; Enable shaders menu NULLDEMO
; Habilitar menú de shaders NULLDEMO
shadersEnabled = true

; Show debug menu NULLDEMO (F1)
; Mostrar menú de depuración NULLDEMO (F1)
; debugMenuEnabled = true
; no funciona por ahora

; Pause menu style: visual (modern) or classic (old-school)
; Estilo del menú de pausa: visual (moderno) o classic (clásico)
; Options: visual, classic
; Opciones: visual, classic
pauseMenuStyle = visual

; Main menu style: Sempaidemo (classic) or NullDemo (modern)
; Estilo del menú principal: Sempaidemo (clásico) o NullDemo (moderno)
; Options: Sempaidemo, NullDemo, oldmenu (alias for Sempaidemo)
; Opciones: Sempaidemo, NullDemo, oldmenu (alias de Sempaidemo)
mainMenuStyle = NullDemo

; Test mode: repeat Notices and first-time menu setup on every engine launch.
; Modo de pruebas: repetir avisos y seleccion inicial de menu en cada arranque.
; true ignores the saved setup completion and showNoticesOnStartup = false.
; true ignora que ya completaste la configuracion y fuerza los avisos.
; Runs once per session. Does not erase saves. Opening still uses showOpeningVideo.
; Una vez por sesion, sin borrar partidas. El opening respeta showOpeningVideo.
; Set false to return to normal startup / Pon false para volver al inicio normal.
firstTimeMode = false

; Show NoticesState when the engine starts
; Mostrar NoticesState al abrir el engine
; Set to false to go directly to the selected main menu
; Ponlo en false para entrar directamente al menú principal elegido
showNoticesOnStartup = true

; Show the Corruption opening video before Notices or the selected menu
; Mostrar el vídeo de apertura de Corruption antes de Notices o del menú elegido
; Set to false to skip opening.mp4
; Ponlo en false para saltar opening.mp4
showOpeningVideo = true

; ===== GAME BEHAVIOR =====
; ===== COMPORTAMIENTO DEL JUEGO =====
[gameplay]
; Auto pause when window loses focus
; Pausa automática cuando la ventana pierde el foco
autoPause = true

; Show in-game script error panel (Lua/HScript)
; Mostrar panel de errores de scripts dentro del juego (Lua/HScript)
showScriptErrors = false

; Enable Discord Rich Presence
; Habilitar Rich Presence de Discord
discordEnabled = true


; ===== ENGINE INFO =====
; ===== INFORMACIÓN DEL ENGINE =====
[engine]
; Engine name
; Nombre del engine
engineName = Corruption Engine MK Psych Engine port 2.4
; Engine version
; Versión del engine
engineVersion = psych engine 1.0.4
; Game title
; Título del juego
gameTitle = Friday Night Funkin'
; Mod/Game name (change this for your mod!)
; Nombre del mod/juego (¡cámbialo para tu mod!)
modName = Corruption Engine MK
; Mod version
; Versión del mod
modVersion = 2.0 (Restored)

; ===== SAVE DATA =====
; ===== DATOS DE GUARDADO =====
[saves]
; Enable save system
; Habilitar sistema de guardado
savesEnabled = true
; Auto-save progress
; Guardado automático del progreso
autoSave = true
; Save slot location
; Ubicación de la ranura de guardado
savePath = saves/
; Encrypt save data
; Cifrar datos de guardado
encryptSaves = false

; ===== CONTROLS =====
; ===== CONTROLES =====
[controls]
; Allow custom key bindings
; Permitir configuración personalizada de teclas
customKeybinds = true
; Controller support
; Soporte para mando/control
controllerEnabled = true
; Use mouse in menus
; Usar el mouse en los menús
mouseInMenus = true
